name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release 版本（留空则用 pubspec.yaml 版本），例如 1.3.0"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      # 静态分析 + 单元测试（可选但推荐，失败则中止发布）
      # 仅把真正的 error 作为失败门槛；info/warning 级风格 lint 不阻塞发布
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      # 构建全 ABI 的 release APK
      - name: Build release APK
        run: flutter build apk --release

      # 解析版本号：优先用 dispatch 输入的版本，否则取 pubspec.yaml
      - name: Resolve version
        id: version
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            VER=$(grep -E "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VER"

      - name: Stage APK
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="build/app/outputs/flutter-apk/app-release.apk"
          VER="${{ steps.version.outputs.version }}"
          # 由 tag 触发时 tag 名形如 v1.3.0，用它做文件名版本；否则用解析出的版本号
          REF="${{ github.ref_type }}"
          if [ "$REF" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="$VER"
          fi
          OUT="dist/Sub2API管理面板_v${TAG}.apk"
          cp "$APK" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "asset-name=$(basename "$OUT")" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_name }}"
          name: "Sub2API 管理面板 v${{ steps.version.outputs.version }}"
          body: |
            ## Sub2API 管理面板 v${{ steps.version.outputs.version }}

            - 构建环境：GitHub Actions（Flutter stable + Ubuntu latest）
            - ABI：arm64-v8a / armeabi-v7a / x86_64（全 ABI fat APK）
            - 包名：`com.sub2api.admin`

            > 安装：下载下方 APK 直接安装即可。
          files: |
            ${{ steps.assets.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
